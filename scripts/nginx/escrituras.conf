# Configuración de Nginx para Ubuntu — Sistema de Borradores de Escrituras Públicas
# Ubicación en Ubuntu: /etc/nginx/sites-available/escrituras
# Habilitar con: sudo ln -s /etc/nginx/sites-available/escrituras /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name localhost _;

    # Tamaño máximo de subida coincidente con backend (10 MB)
    client_max_body_size 12M;

    # 1. Frontend estático (compilado con npm run build)
    root /opt/sistema-borradores-escrituras/frontend/dist;
    index index.html;

    # Manejo de rutas de React Router (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy inverso hacia el backend FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 3. Documentación interactiva FastAPI
    location ~ ^/(docs|openapi.json|redoc) {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Compresión gzip para archivos web
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
}
